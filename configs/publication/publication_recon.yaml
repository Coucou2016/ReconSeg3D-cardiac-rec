# Publication main line: sparse-SA recon + 3D seg + geometry-aware motion.
# MACE / Cox weights are zero (supplementary / extensibility only).
# allow_fake_data: false — hard error if public roots are missing OR if
# source is synthetic. For geometry smoke use configs/smoke_motion.yaml.

seed: 42
deterministic: true
device: auto
output_dir: outputs/publication_recon
run_name: publication_recon

data:
  source: acdc  # requires real/proxy ACDC under root; synthetic forbidden here
  root: data/acdc
  allow_fake_data: false
  auto_fake: false
  in_channels: 1
  num_frames: 8
  spatial_size: [16, 32, 32]  # paper-scale: [128, 256, 256] (D, H, W)
  batch_size: 2
  num_workers: 0
  clinical_dim: 0
  slice_sampling: true
  slice_s_range: [8, 16]
  slice_rot_deg: [1, 5]
  slice_trans_px: [1, 5]
  slice_noise_std: 0.02

model:
  arch: reconseg3d
  in_channels: 1
  num_seg_classes: 4
  base_channels: 16
  temporal_mode: temporal_conv
  clinical_dim: 0
  dropout: 0.2
  per_frame_recon: true
  predict_motion: true
  per_frame_seg: true
  fusion: concat
  task: reconstruction
  use_svf: false  # TODO: SVF + scaling-and-squaring (stub in MotionNet)

loss:
  w_seg: 0.0
  w_recon: 0.0
  w_mace: 0.0
  w_cox: 0.0
  recon_loss: l2
  mace_loss: bce
  use_dice: true
  alpha1: 0.1
  alpha2: 1.0
  alpha3: 0.2
  w_warp: 0.05
  w_cycle: 0.02   # auxiliary image-cycle (not L_inv)
  w_inv: 0.1
  w_smooth: 0.05
  w_jac: 0.05
  jac_eps: 0.0
  w_loop: 0.05
  w_ed_ref: 0.05  # ED-anchored composed-path inverse consistency
  w_volsmooth: 0.01  # demoted physiological regularizer
  w_segsmooth: 0.0

metrics:
  hd95: true

selection:
  metric: recon_mae
  mode: min

train:
  epochs: 10
  lr: 0.001
  weight_decay: 0.0001
  grad_clip: 1.0
  amp: false
  early_stop_patience: 0
